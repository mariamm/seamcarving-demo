<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Resize images by removing low-energy seams. Runs locally in your browser.">
  <title>Seam Carving</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./carve.js"></script>
</head>
<body>
  <main id="workspace">
    <header class="intro">
      <div>
        <h1>Seam Carving<span aria-hidden="true">.</span></h1>
        <p>Shrink the width of a photo while preserving detail. Images stay on your device.</p>
      </div>
      <div class="actions">
        <button id="sample" type="button">Load sample</button>
        <label class="upload primary">Open image<input id="file" type="file" accept="image/*"></label>
      </div>
    </header>

    <section class="controls" aria-label="Resize controls">
      <div class="target">
        <label for="size">Target width <output id="target" for="size">—</output></label>
        <input id="size" type="range" min="1" max="1" value="1" disabled>
      </div>
      <label class="toggle"><input id="show-energy" type="checkbox" disabled> Show energy map</label>
      <button id="download" class="primary" type="button" disabled>Download PNG</button>
    </section>

    <p id="status" role="status">Loading sample…</p>

    <div class="previews">
      <figure>
        <figcaption><strong id="source-title">Original</strong><span id="source-size"></span></figcaption>
        <div class="stage">
          <canvas id="original" aria-label="Original image"></canvas>
          <canvas id="energy" aria-label="Original image energy map with removed seams in red" hidden></canvas>
        </div>
      </figure>
      <figure>
        <figcaption><strong>Carved</strong><span id="result-size"></span></figcaption>
        <div class="stage">
          <canvas id="result" aria-label="Carved image"></canvas>
        </div>
      </figure>
    </div>
    <footer id="credit" hidden>Sample <a href="https://commons.wikimedia.org/wiki/File:Broadway_tower_edit.jpg">Broadway Tower</a> by Newton2, cropped by Yummifruitbat and resized for this demo. <a href="https://creativecommons.org/licenses/by/2.5/">CC BY 2.5</a>.</footer>
  </main>
</body>
</html>
